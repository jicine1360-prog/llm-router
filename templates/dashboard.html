<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Router - 게이트웨이 대시보드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Noto Sans KR',sans-serif; background:#0a0e17; color:#e0e6f0; }
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:#0a0e17; }
::-webkit-scrollbar-thumb { background:#1e3a5f; border-radius:3px; }
.container { max-width:1400px; margin:0 auto; padding:20px; }

header {
  display:flex; justify-content:space-between; align-items:center;
  padding:16px 24px; margin-bottom:24px;
  background:linear-gradient(135deg,#0f1a2e,#162240);
  border:1px solid #1e3a5f; border-radius:16px;
}
header h1 { font-size:20px; font-weight:900; background:linear-gradient(90deg,#00d4ff,#a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
header span { font-size:12px; color:#6b8aaf; margin-left:12px; }
.header-right { display:flex; gap:12px; align-items:center; }
.badge { padding:4px 12px; border-radius:6px; font-size:11px; font-weight:500; }
.badge-ok { background:rgba(0,200,83,0.15); color:#00c853; border:1px solid rgba(0,200,83,0.3); }
.badge-warn { background:rgba(255,193,7,0.15); color:#ffc107; border:1px solid rgba(255,193,7,0.3); }

.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:24px; }
.card {
  background:linear-gradient(135deg,#0f1a2e,#141e34);
  border:1px solid #1e3a5f; border-radius:12px; padding:20px;
}
.card h3 { font-size:13px; color:#6b8aaf; margin-bottom:8px; text-transform:uppercase; letter-spacing:1px; }
.card .value { font-size:28px; font-weight:700; }
.card .value.green { color:#00c853; }
.card .value.blue { color:#00d4ff; }
.card .value.yellow { color:#ffc107; }

.section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.section-header h2 { font-size:16px; font-weight:700; }

.models-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; margin-bottom:24px; }
.model-card {
  background:#0d1525; border:1px solid #1a2a40; border-radius:10px; padding:14px;
  display:flex; flex-direction:column; gap:6px;
}
.model-card .name { font-size:13px; font-weight:600; }
.model-card .caps { font-size:11px; color:#6b8aaf; }
.model-card .status { font-size:11px; }
.model-ok { color:#00c853; }
.model-down { color:#ff5252; }
.model-cap { display:inline-block; font-size:10px; padding:1px 6px; border-radius:4px; background:rgba(0,212,255,0.1); color:#00d4ff; margin-right:4px; }

.log-table { width:100%; border-collapse:collapse; font-size:12px; }
.log-table th { text-align:left; padding:8px 12px; border-bottom:1px solid #1a2a40; color:#4a6a8a; font-weight:500; }
.log-table td { padding:8px 12px; border-bottom:1px solid #0d1525; }
.log-cached { color:#ffc107; }
.log-error { color:#ff5252; }

.action-bar { display:flex; gap:8px; margin-bottom:16px; }
.btn {
  padding:8px 16px; border:1px solid #1e3a5f; border-radius:6px;
  background:linear-gradient(135deg,#0f1a2e,#162240); color:#00d4ff;
  cursor:pointer; font-size:12px; font-family:inherit; transition:all 0.2s;
}
.btn:hover { border-color:#00d4ff; }
.btn-danger { color:#ff5252; border-color:#3a1a1a; }
.btn-danger:hover { border-color:#ff5252; }

.loading { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px; }
.spinner { width:32px; height:32px; border:3px solid #1e3a5f; border-top-color:#00d4ff; border-radius:50%; animation:spin 0.8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>LLM Router <span>통합 AI 게이트웨이</span></h1>
    </div>
    <div class="header-right">
      <span id="endpointDisplay" style="font-size:12px;color:#4a6a8a;">호환 엔드포인트: /v1/chat/completions</span>
      <span class="badge badge-ok" id="statusBadge">● 운용중</span>
    </div>
  </header>

  <div class="grid" id="statsGrid">
    <div class="card"><h3>모델</h3><div class="value blue" id="modelCount">-</div></div>
    <div class="card"><h3>캐시 히트율</h3><div class="value green" id="hitRate">-</div></div>
    <div class="card"><h3>요청 수</h3><div class="value yellow" id="requestCount">-</div></div>
  </div>

  <div class="section-header">
    <h2>🔌 모델 상태</h2>
    <div class="action-bar" style="margin:0">
      <button class="btn" onclick="refreshStatus()">⟳ 새로고침</button>
    </div>
  </div>
  <div class="models-grid" id="modelsGrid"></div>

  <div class="section-header">
    <h2>📋 실시간 요청 로그</h2>
    <div class="action-bar" style="margin:0">
      <button class="btn" onclick="clearLog()">로그 지우기</button>
      <button class="btn btn-danger" onclick="clearCache()">캐시 초기화</button>
    </div>
  </div>
  <table class="log-table" id="logTable">
    <thead><tr><th>시간</th><th>모델</th><th>작업 유형</th><th>상태</th></tr></thead>
    <tbody id="logBody"></tbody>
  </table>
</div>

<script>
let autoRefresh = null;

function init() {
  refreshStatus();
  refreshLogs();
  if (autoRefresh) clearInterval(autoRefresh);
  autoRefresh = setInterval(() => {
    refreshStatus();
    refreshLogs();
  }, 5000);
}

async function refreshStatus() {
  try {
    const [status, config] = await Promise.all([
      fetch('/api/status').then(r=>r.json()),
      fetch('/api/config').then(r=>r.json()),
    ]);

    // Stats
    document.getElementById('modelCount').textContent = Object.keys(status.models || {}).length;
    const cache = status.cache || {};
    const total = (cache.hits || 0) + (cache.misses || 0);
    const rate = total > 0 ? ((cache.hits / total) * 100).toFixed(0) + '%' : '0%';
    document.getElementById('hitRate').textContent = rate;
    document.getElementById('requestCount').textContent = status.requests_served || 0;
    document.getElementById('statusBadge').className = 'badge badge-ok';

    // Models
    const grid = document.getElementById('modelsGrid');
    const models = status.models || {};
    const caps = {};
    if (config.models) {
      Object.entries(config.models).forEach(([k,v]) => { caps[k] = v.capabilities || []; });
    }
    grid.innerHTML = Object.entries(models).map(([name, st]) => {
      const isOk = st === 'ok';
      const modelCaps = caps[name] || [];
      return `<div class="model-card">
        <div class="name">${name}</div>
        <div class="caps">${modelCaps.map(c => `<span class="model-cap">${c}</span>`).join('')}</div>
        <div class="status ${isOk ? 'model-ok' : 'model-down'}">${isOk ? '● 정상' : '○ 연결 불가'}</div>
      </div>`;
    }).join('');
  } catch(e) {
    document.getElementById('statusBadge').className = 'badge badge-warn';
    document.getElementById('statusBadge').textContent = '⚠ 연결 오류';
  }
}

async function refreshLogs() {
  try {
    const data = await fetch('/api/logs?limit=50').then(r=>r.json());
    const tbody = document.getElementById('logBody');
    tbody.innerHTML = (data.logs || []).reverse().map(log => {
      let status = log.cached ? '캐시' : (log.error ? '오류' : '✓');
      let cls = log.cached ? 'log-cached' : (log.error ? 'log-error' : '');
      const time = new Date(log.time).toLocaleTimeString('ko-KR');
      return `<tr><td>${time}</td><td>${log.model}</td><td>${log.task_type}</td><td class="${cls}">${status}</td></tr>`;
    }).join('');
  } catch(e) {}
}

async function clearCache() {
  if (!confirm('캐시를 초기화할까요?')) return;
  await fetch('/api/cache/clear', {method:'POST'});
  refreshStatus();
}

function clearLog() {
  document.getElementById('logBody').innerHTML = '';
}

init();
</script>
</body>
</html>
